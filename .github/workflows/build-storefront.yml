name: Build and Push saleor-storefront (dev)

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-3
      ECR_REPOSITORY: saleor-3tier-dev-storefront
      IMAGE_BASE_URL: 069423016509.dkr.ecr.ap-northeast-3.amazonaws.com

      # ---- Saleor Storefront 빌드용 설정 ----
      # 빌드 시 스키마 가져올 GraphQL 엔드포인트 (지금은 Saleor 데모 사용)
      SALEOR_API_URL: "https://demo.saleor.io/graphql/"
      # 최종 스토어프론트 URL (지금은 임시, 나중에 ALB/도메인 완성되면 변경)
      STOREFRONT_URL: "https://storefront.dev.example.com/"
      DEFAULT_CHANNEL: "default-channel"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SALEOR_API_URL=${{ env.SALEOR_API_URL }} \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL=${{ env.STOREFRONT_URL }} \
            --build-arg NEXT_PUBLIC_DEFAULT_CHANNEL=${{ env.DEFAULT_CHANNEL }} \
            --build-arg SKIP_BUILD_STATIC_GENERATION=true \
            -t $IMAGE_BASE_URL/$ECR_REPOSITORY:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_BASE_URL/$ECR_REPOSITORY:latest

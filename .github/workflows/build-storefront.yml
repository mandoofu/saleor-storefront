name: Build and Push saleor-storefront (dev)

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-3
      ECR_REPOSITORY: saleor-3tier-dev-storefront
      IMAGE_BASE_URL: 069423016509.dkr.ecr.ap-northeast-3.amazonaws.com

      # ---- Saleor Storefront 빌드에 필요한 환경 ----
      SALEOR_API_URL: "http://saleor-core.backend.svc.cluster.local:8000/graphql/"
      STOREFRONT_URL: "https://storefront.dev.example.com/"      # 나중에 실제 도메인으로 수정
      DEFAULT_CHANNEL: "default-channel"                         # Saleor 채널 이름

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SALEOR_API_URL=${{ env.SALEOR_API_URL }} \
            --build-arg NEXT_PUBLIC_STOREFRONT_URL=${{ env.STOREFRONT_URL }} \
            --build-arg NEXT_PUBLIC_DEFAULT_CHANNEL=${{ env.DEFAULT_CHANNEL }} \
            -t $IMAGE_BASE_URL/$ECR_REPOSITORY:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_BASE_URL/$ECR_REPOSITORY:latest
